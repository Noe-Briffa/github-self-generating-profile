name: Update profile

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Generate profile
        run: npm run generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test profile rendering
        run: npm test

      - name: Validate generated SVG XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('assets/profile.svg')"

      - name: Commit updated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub profile"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
